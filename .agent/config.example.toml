# Copy to .agent/config.toml; preserve your project's actual paths and policies.
[project]
architecture = "architecture/target.md"
backlog = "backlog/frontier.md"
item_details = "backlog/items"
decisions = "architecture/decisions"
default_branch = "main"

[verification]
# Example only: replace with your actual local gate and safe environment instructions.
command = ["python3", "-m", "unittest", "discover", "-s", "tests"]
environment = "offline; no mutable services"

[policy]
merge_authority = "designated reviewer/operator; executor never self-merges"
# Point to existing policy/runbooks when this short description is insufficient.
# Example of a standing delegation for unattended rounds (see .agent/supervisor.md):
# merge_authority = """planner, through python3 scripts/merge_guard.py only (raw gh pr merge is
# denied); PRs touching the permission rules, the guard itself or gate/verdict records stay with
# the operator"""

# Optional: only read by scripts/merge_guard.py, a merge path for delegated merge authority.
# [merge_guard]
# method = "squash"                       # merge (default), squash or rebase
# operator_paths = ["docs/decisions/*"]   # default: [project] architecture and decisions
#                                         # .agent/config.toml, .claude/* and the guard: always

# Optional: only read by scripts/round_supervisor.py (see .agent/supervisor.md).
# [supervisor]
# name = "my-repo"          # Herdr name slug; defaults to the checkout's directory name
# permission_mode = "auto"   # unattended sessions cannot answer approval dialogs
# lane_harnesses = ["codex", "claude", "opencode"]   # executor preference; next one on a limit
#
# [supervisor.harness_commands]   # launch templates; {worktree}, {task}, {model} are filled in
# codex = 'codex exec --approve-for-me -C {worktree} "{task}"'
# claude = 'claude -p --permission-mode auto "{task}"'
# opencode = 'opencode run --auto -m {model} "{task}"'
